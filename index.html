<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wishme – Cakes & Celebrations</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pk:#ef3e72;--pk2:#fde4ec;--navy:#16224f;--gn:#16a34a;--bg:#fdf5f7;--card:#fff;--ink:#1f2340;--mut:#6b7090;--line:#eee2e7;--shadow:0 4px 16px rgba(60,20,50,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a2e;--card:#22263f;--ink:#f1f2fb;--mut:#a3a8c8;--line:#32375a;--pk2:#4a2236}}
:root[data-theme="dark"]{--bg:#171a2e;--card:#22263f;--ink:#f1f2fb;--mut:#a3a8c8;--line:#32375a;--pk2:#4a2236}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Poppins,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--pk);outline-offset:2px}
header{background:var(--card);box-shadow:var(--shadow);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:10px 14px}
.brand{font-weight:700;font-size:20px;color:var(--pk)}.brand small{display:block;font-size:11px;font-weight:400;color:var(--mut);margin-top:-4px}
.seg{display:flex;gap:6px;margin-top:8px}.seg button{flex:1;border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:6px;font-size:13px;font-weight:600}
.seg button.on{background:var(--pk);border-color:var(--pk);color:#fff}
main{max-width:720px;margin:0 auto;padding:14px 14px calc(88px + env(safe-area-inset-bottom,0px))}
h2{font-size:17px;margin:20px 0 10px;font-weight:700}h3{margin:0;font-size:15px}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.hero{background:linear-gradient(135deg,#ffd6e2,#ffb3c8 60%,#ff8fb0);border-radius:22px;padding:20px;display:flex;align-items:center;gap:8px;color:#4a1230;overflow:hidden}
.hero h1{margin:0;font-size:26px;line-height:1.2}.hero p{margin:8px 0 14px;font-size:13px}.big{font-size:92px;line-height:1;position:relative}.big i{position:absolute;right:-6px;top:-14px;font-size:38px;font-style:normal}
.btn{border:0;border-radius:12px;background:var(--pk);color:#fff;font-weight:600;padding:12px 18px}.btn.full{width:100%;margin-top:12px}.btn.ghost{background:transparent;border:1.5px solid var(--pk);color:var(--pk)}.btn.gn{background:var(--gn)}.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.occ{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}.occ button{flex:0 0 76px;border:0;background:transparent;text-align:center;font-size:12px}
.ic{width:56px;height:56px;border-radius:16px;background:var(--pk2);display:grid;place-items:center;font-size:28px;margin:0 auto 4px}
.ev{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px 6px;text-align:center;font-size:13px;font-weight:500}.ev.on{border-color:var(--pk);background:var(--pk2)}.ev .ic{background:transparent;font-size:34px;height:44px}
.cakes{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ck{border:0;background:var(--card);border-radius:18px;padding:10px;text-align:left;box-shadow:var(--shadow)}
.ck .pic{height:84px;border-radius:14px;display:grid;place-items:center;font-size:48px;margin-bottom:6px}.ck b{display:block;font-size:13px}.ck span{font-size:13px;color:var(--pk);font-weight:600}
.stepper{display:flex;justify-content:space-between;margin:4px 0 14px}.stp{flex:1;text-align:center;font-size:12px;color:var(--mut);font-weight:500}
.stp b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);margin:0 auto 2px;background:var(--card)}.stp.on{color:var(--pk)}.stp.on b{background:var(--pk);border-color:var(--pk);color:#fff}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=tel],input[type=date],select{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
.add{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.add:last-child{border:0}.add .ic{width:48px;height:48px;font-size:24px;margin:0}.add div.t{flex:1}.add small{color:var(--mut);display:block}
.add input[type=checkbox],.pay input{width:20px;height:20px;accent-color:var(--pk)}
.qty{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;padding:2px 6px}.qty button{border:0;background:none;font-size:18px;width:24px}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin-top:10px}
.pay{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:12px;margin-top:8px;font-weight:500}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;background:#dcfce7;color:#166534}.chip.w{background:#fef3c7;color:#92400e}.chip.b{background:#dbeafe;color:#1e40af}.chip.p{background:#ffe4ec;color:#be123c}
.tl{margin:10px 0 0 4px}.tl div{position:relative;padding:0 0 14px 28px;font-size:14px;color:var(--mut)}.tl div:before{content:"";position:absolute;left:0;top:2px;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--card)}
.tl div:after{content:"";position:absolute;left:6px;top:18px;bottom:-2px;width:2px;background:var(--line)}.tl div:last-child:after{display:none}
.tl .d{color:var(--ink);font-weight:600}.tl .d:before{background:var(--gn);border-color:var(--gn)}.tl .d:after{background:var(--gn)}
.dp{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:10px;margin-top:6px}.av{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .card{margin:0}.stats b{font-size:22px;display:block}.stats span{font-size:12px;color:var(--mut)}
.tb{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.tb:last-child{border:0}
.dh{background:var(--gn);color:#fff;border-radius:18px;padding:14px;margin-bottom:12px}.dh select{background:#fff2;border-color:#fff4;color:#fff}.dh option{color:#000}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);box-shadow:0 -4px 16px rgba(0,0,0,.08);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{flex:1;border:0;background:none;font-size:12px;color:var(--mut);font-weight:500}nav button span{display:block;font-size:22px}nav button.on{color:var(--pk)}
.err{color:#dc2626;font-weight:600;font-size:13px;margin-top:8px}.mut{color:var(--mut);font-size:13px}.how{display:flex;gap:10px;align-items:center;margin:8px 0}.how b{width:28px;height:28px;border-radius:50%;background:var(--pk);color:#fff;display:grid;place-items:center;flex:0 0 28px;font-size:13px}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}.cf i{position:absolute;top:-12px;width:9px;height:14px;animation:f 2.4s linear forwards}@keyframes f{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.cf i{animation-duration:.01s}}

body{background:linear-gradient(180deg,#ffe3ec,var(--bg) 320px) fixed}
.card,.ck{box-shadow:inset 0 1px 0 #fff8,0 10px 24px rgba(120,30,70,.13),0 2px 4px rgba(120,30,70,.08)}
.btn{box-shadow:0 4px 0 #b82253;transition:transform .1s,box-shadow .1s}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b82253}.btn.ghost,.btn.sm{box-shadow:none}.btn.gn{box-shadow:0 4px 0 #0f7a36}
.ck{transition:transform .2s}.ck:hover,.ck:active{transform:perspective(500px) rotateX(6deg) rotateY(-6deg) translateY(-3px)}
.ck .pic{box-shadow:inset 0 -8px 14px rgba(0,0,0,.08);text-shadow:0 6px 8px rgba(0,0,0,.25)}
.hero{flex-direction:column;text-align:center;padding-bottom:0}
.scene{perspective:800px;height:220px;width:100%;display:grid;place-items:center;overflow:hidden}
.w3{position:relative;width:170px;height:170px;transform-style:preserve-3d;transform:rotateX(-24deg)}
.spin{position:absolute;inset:0;transform-style:preserve-3d;animation:sp 12s linear infinite}
@keyframes sp{to{transform:rotateY(360deg)}}
.dk{position:absolute;left:50%;top:50%;border-radius:50%}
@media (prefers-reduced-motion:reduce){.spin{animation:none;transform:rotateY(30deg)}}
.sub{font-size:12px;color:var(--mut);font-weight:500;margin-top:2px}

.qr{width:104px;height:104px;display:grid;place-items:center;font-weight:700;background:#fff;padding:4px;border-radius:6px;color:#111}.qr img,.qr canvas{width:96px!important;height:96px!important}
#lab{position:fixed;inset:0;background:rgba(20,10,30,.65);z-index:20;overflow:auto;padding:16px;display:none}#lab:not(:empty){display:block}
.lbl{background:#fff;color:#111;max-width:340px;margin:0 auto;border:2px dashed #111;border-radius:6px;padding:10px;font-size:12px;line-height:1.35}
.lh{display:flex;justify-content:space-between;font-size:15px;border-bottom:2px solid #111;padding-bottom:4px;margin-bottom:6px}.lq{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.lm,.lf{border-top:1px solid #999;padding-top:5px;margin-top:5px}.lf{display:flex;justify-content:space-between;font-size:13px}.lw{margin-top:6px;text-align:center;background:#111;color:#fff;padding:2px;font-size:11px;letter-spacing:.5px}
.nop{max-width:340px;margin:12px auto;display:flex;gap:10px}.nop .btn{flex:1;margin:0}
@media print{body>*:not(#lab){display:none!important}#lab{position:static;background:none;padding:0}.nop{display:none}.lbl{border:1px solid #000}}

.qr{position:relative;-webkit-print-color-adjust:exact;print-color-adjust:exact}.lq .qr{border:2px solid #ef3e72}
.qr.lg:after{content:"🎂";position:absolute;left:50%;top:50%;width:28px;height:28px;transform:translate(-50%,-50%);background:#fff;border:2px solid #ef3e72;border-radius:9px;display:grid;place-items:center;font-size:16px;line-height:1;box-shadow:0 0 0 2px #fff}

.ck .pic img,.pic img{width:100%;height:100%;object-fit:cover;border-radius:14px}.ck .pic{height:110px;font-size:48px}
a.btn{display:block;text-align:center;text-decoration:none;padding:12px 18px}
#seg{display:flex;align-items:center;gap:8px}#seg button{border:1.5px solid var(--pk);background:transparent;color:var(--pk);border-radius:99px;padding:6px 14px;font-weight:600;font-size:13px}
.hd{display:flex;justify-content:space-between;align-items:center}
.qr.xl{width:216px;height:216px}.qr.xl img,.qr.xl canvas{width:200px!important;height:200px!important}.qr.xl.lg:after{width:40px;height:40px;font-size:22px}
.btn[disabled]{opacity:.6}.btn.sm.gn{background:var(--gn)}.tb{display:flex;justify-content:space-between;padding:6px 0}
</style></head><body>
<header><div class="hd"><div class="brand">🎂 Wishme<small>Make every moment sweeter</small></div><div id="seg"></div></div></header>
<main id="app"></main><nav id="nav"></nav><div class="cf" id="cf"></div><div id="lab"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/app.js"></script></body></html>
