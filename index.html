const $=i=>document.getElementById(i),E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),R=n=>"₹"+Number(n).toLocaleString("en-IN");
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
let S={tab:"home",open:null,orders:[],mine:[],staff:null,err:""},DP=[],DPL=[];
try{const x=JSON.parse(localStorage.getItem("wm3"));if(x)S={...S,...x,orders:[],err:""}}catch(e){}

const price=()=>{let t=Math.round(CK[D.ci][1]*D.kg);AD.forEach((a,i)=>{if(D.ad[i])t+=a[2]*D.ad[i]});return D.ok?Math.round(t*.9):t};
function conf(){const c=["#ef3e72","#ffd873","#7fd1b0","#a597ea"];$("cf").innerHTML=Array.from({length:44},()=>`<i style="left:${Math.random()*100}%;background:${c[Math.random()*4|0]};animation-delay:${Math.random()*.6}s"></i>`).join("");setTimeout(()=>$("cf").innerHTML="",3200)}

const PC={"110":["New Delhi","Delhi"],"400":["Mumbai","Maharashtra"],"560":["Bengaluru","Karnataka"],"700":["Kolkata","West Bengal"],"600":["Chennai","Tamil Nadu"],"500":["Hyderabad","Telangana"],"411":["Pune","Maharashtra"],"380":["Ahmedabad","Gujarat"],"302":["Jaipur","Rajasthan"],"226":["Lucknow","Uttar Pradesh"],"462":["Bhopal","Madhya Pradesh"],"452":["Indore","Madhya Pradesh"],"482":["Jabalpur","Madhya Pradesh"],"440":["Nagpur","Maharashtra"],"395":["Surat","Gujarat"],"800":["Patna","Bihar"],"160":["Chandigarh","Chandigarh"],"141":["Ludhiana","Punjab"],"282":["Agra","Uttar Pradesh"],"221":["Varanasi","Uttar Pradesh"],"492":["Raipur","Chhattisgarh"],"834":["Ranchi","Jharkhand"],"751":["Bhubaneswar","Odisha"],"682":["Kochi","Kerala"],"695":["Thiruvananthapuram","Kerala"],"122":["Gurugram","Haryana"],"121":["Faridabad","Haryana"],"422":["Nashik","Maharashtra"],"431":["Aurangabad","Maharashtra"],"390":["Vadodara","Gujarat"],"360":["Rajkot","Gujarat"],"313":["Udaipur","Rajasthan"],"342":["Jodhpur","Rajasthan"],"324":["Kota","Rajasthan"],"474":["Gwalior","Madhya Pradesh"],"248":["Dehradun","Uttarakhand"],"208":["Kanpur","Uttar Pradesh"],"211":["Prayagraj","Uttar Pradesh"],"250":["Meerut","Uttar Pradesh"],"781":["Guwahati","Assam"],"641":["Coimbatore","Tamil Nadu"],"625":["Madurai","Tamil Nadu"],"530":["Visakhapatnam","Andhra Pradesh"],"520":["Vijayawada","Andhra Pradesh"],"575":["Mangaluru","Karnataka"],"570":["Mysuru","Karnataka"],"403":["Panaji","Goa"],"831":["Jamshedpur","Jharkhand"]};
const SM=(t=>{const m={};t.split(",").forEach(x=>{const[r,n]=x.split(" "),[a,b]=r.split("-");for(let i=+a;i<=+(b||a);i++)m[i]=n.replace(/_/g," ")});return m})("11 Delhi,12-13 Haryana,14-16 Punjab,17 Himachal_Pradesh,18-19 Jammu_&_Kashmir,20-28 Uttar_Pradesh,30-34 Rajasthan,36-39 Gujarat,40-44 Maharashtra,45-48 Madhya_Pradesh,49 Chhattisgarh,50 Telangana,51-53 Andhra_Pradesh,56-59 Karnataka,60-64 Tamil_Nadu,67-69 Kerala,70-74 West_Bengal,75-77 Odisha,78 Assam,80 Bihar");
const cyl=(w,y,h,bg)=>{let s="";for(let i=0;i<h;i+=2)s+=`<div class="dk" style="width:${w}px;height:${w}px;margin:${-w/2}px 0 0 ${-w/2}px;background:${bg};transform:translateY(${50-y-i}px) rotateX(90deg)"></div>`;return s};

 let h=cyl(196,-8,6,"#f3e3d6")+cyl(150,0,44,g(a,b))+cyl(158,44,4,"#fff")+cyl(112,48,38,g(b,a))+cyl(120,86,4,"#fff")+cyl(76,90,30,g(a,b))+cyl(84,120,4,"#fff");
 [-16,0,16].forEach(x=>{h+=pl(x,124,6,26,"#ffd873","2px")+pl(x,150,9,13,"radial-gradient(#fff3a0,#ff9a3c)","50%")});
 return `<div class="scene" aria-hidden="true"><div class="w3"><div class="spin">${h}</div></div></div>`}
const greet=()=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><b>${S.user?"Hi, "+E(S.user.name.split(" ")[0])+"!":"Welcome!"} 🎉</b><div class="mut">What are we celebrating?</div></div>${S.user?'<button class="btn sm ghost" data-a="out">Log out</button>':""}</div>`;
const auth=()=>`<div style="text-align:center;margin-top:4px">${cake3d(...CC[D.ci])}<h1 style="margin:0;color:var(--pk);font-size:30px">Wishme</h1><div class="mut">Cakes &amp; celebrations, delivered with love</div></div>

function login(){const n=(D.name||"").trim(),p=D.phone||"";if(n.length<2){D.err="Enter your name.";return}if(!/^\d{10}$/.test(p)){D.err="Enter a 10-digit mobile number.";return}D.err="";S.user={name:n,phone:p};D=Object.assign(nd(),{ci:D.ci});S.tab="home";conf()}

const needsLoad=()=>!!S.staff||(S.tab=="orders"&&S.mine.length>0);
async function load(){try{if(S.staff&&S.staff.role=="admin"){const[o,d]=await Promise.all([api("/admin/orders"),api("/admin/delivery")]);DPL=d;DP=d.map(x=>x.name);S.orders=o.map(x=>{const k=DPL.findIndex(y=>y.id==x.delivery_id);return{...x,dv:k<0?null:k}})}
 else if(S.staff)S.orders=await api("/delivery/orders");
 else if(S.mine.length)S.orders=(await api("/orders/track","POST",{ids:S.mine})).map(x=>({...x,mine:1}));else S.orders=[]}catch(e){if(S.staff)S.err=e.message}render()}
async function act(p,m,b,dl){S.err="";try{await api(p,m,b);if(dl)conf()}catch(e){S.err=e.message;if(!dl)alert(e.message)}load()}
async function slogin(){const p=$("s_p").value.trim(),w=$("s_w").value;S.err="";try{const r=await api("/login","POST",{phone:p,password:w});if(r.role!="admin"&&r.role!="delivery")throw new Error("This login is only for staff.");S.staff={token:r.token,role:r.role,name:r.name};S.tab="home";S.orders=[]}catch(e){S.err=e.message}render();load()}
async function addDel(){S.err="";try{await api("/admin/delivery","POST",{name:$("ad_n").value,phone:$("ad_p").value.trim(),password:$("ad_w").value})}catch(e){S.err=e.message}load()}
const staffView=()=>`<div class="card" style="margin-top:12px"><h3>Staff login</h3><div class="mut">For the owner and delivery partners.</div><label for="s_p">Mobile number</label><input type="tel" id="s_p" inputmode="numeric" maxlength="10" autocomplete="username"><label for="s_w">Password</label><input type="password" id="s_w" autocomplete="current-password">${S.err?`<div class="err" role="alert">${E(S.err)}</div>`:""}<button class="btn full" data-a="slogin">Log in</button></div>`;
function home(){return `${greet()}<div class="hero"><div><h1>Plan Your Perfect Celebration</h1><p>Cakes • Party bookings • Decorations • Food</p><button class="btn" data-a="go" data-v="book" style="background:#fff;color:var(--pk)">Book now</button></div>${cake3d(...CC[D.ci])}</div>
<h2>Popular occasions</h2><div class="occ">${EV.map((e,i)=>`<button data-a="ev" data-i="${i}"><div class="ic">${e[0]}</div>${e[1]}</button>`).join("")}</div>
<h2>Our special cakes</h2><div class="cakes">${CK.map((c,i)=>`<button class="ck" data-a="ck" data-i="${i}"><div class="pic" style="background:${c[3]}">${c[2]}</div><b>${c[0]}</b><span>${R(c[1])}/kg</span></button>`).join("")}</div>
<h2>How it works</h2><div class="card">${["Choose event, date and slot","Add cake, decoration and food","Confirm and pay","Track your order live"].map((x,i)=>`<div class="how"><b>${i+1}</b>${x}</div>`).join("")}<div class="mut">Book up to 10 days in advance. Use code WISH10 for 10% off.</div></div>`}
function book(){const stp=["Event Details","Add-ons","Payment"];let h=`<div class="stepper">${stp.map((x,i)=>`<div class="stp ${D.st>=i+1?"on":""}"><b>${i+1}</b>${x}</div>`).join("")}</div>`;
if(D.st==1){const t=new Date(),m=new Date();m.setDate(m.getDate()+10);h+=`<div class="card"><h3>Select event type</h3><div class="row" style="margin-top:10px">${EV.map((e,i)=>`<button class="ev ${D.ev==i?"on":""}" data-a="ev2" data-i="${i}"><div class="ic">${e[0]}</div>${e[1]}</button>`).join("")}</div>
<div class="g2"><div><label for="f_date">Event date</label><input type="date" id="f_date" data-f="date" data-r="1" min="${iso(t)}" max="${iso(m)}" value="${D.date}"></div><div><label for="f_slot">Delivery slot</label><select id="f_slot" data-f="slot" data-r="1">${["10 AM – 12 PM","12 PM – 3 PM","3 PM – 6 PM","6 PM – 9 PM"].map(x=>`<option ${x==D.slot?"selected":""}>${x}</option>`).join("")}</select></div></div>
<label for="f_msg">Message on cake</label><input type="text" id="f_msg" data-f="msg" maxlength="30" value="${E(D.msg)}"></div>
<div class="card"><h3>📍 Delivery address</h3>
<div class="g2"><div><label for="f_name">Full name</label><input type="text" id="f_name" data-f="name" value="${E(D.name)}" autocomplete="name"></div><div><label for="f_phone">10-digit mobile</label><input type="tel" id="f_phone" data-f="phone" value="${E(D.phone)}" inputmode="numeric" maxlength="10" autocomplete="tel"></div></div>
<div class="g2"><div><label for="f_pin">Pincode</label><input type="text" id="f_pin" data-f="pin" value="${E(D.pin)}" inputmode="numeric" maxlength="6" autocomplete="postal-code"></div><div><label for="f_loc">Locality / Area</label><input type="text" id="f_loc" data-f="loc" value="${E(D.loc)}" list="areas" autocomplete="off"><datalist id="areas"></datalist></div></div>
<label for="f_house">Flat / House no. / Building</label><input type="text" id="f_house" data-f="house" value="${E(D.house)}">
<label for="f_street">Road name / Street / Colony</label><input type="text" id="f_street" data-f="street" value="${E(D.street)}" autocomplete="address-line1">
<label for="f_land">Landmark (optional)</label><input type="text" id="f_land" data-f="land" value="${E(D.land)}" placeholder="Near temple, school, mall">
<div class="g2"><div><label for="f_city">City / District</label><input type="text" id="f_city" data-f="city" value="${E(D.city)}" autocomplete="address-level2"></div><div><label for="f_state">State</label><input type="text" id="f_state" data-f="state" value="${E(D.state)}" autocomplete="address-level1"></div></div>
<div class="mut" style="margin-top:6px">City and state fill automatically when you type the pincode.</div>
<label>Address type</label>${["Home","Work"].map(x=>`<button class="ev ${D.at==x?"on":""}" data-a="at" data-v="${x}" style="padding:8px 20px;margin-right:8px">${x}</button>`).join("")}</div>`}
if(D.st==2){h+=`<div class="card"><h3>Add what you need</h3><div class="add"><div class="ic" style="background:${CK[D.ci][3]}">${CK[D.ci][2]}</div><div class="t"><b>${CK[D.ci][0]}</b><small>${R(CK[D.ci][1])}/kg</small></div><select data-f="kg" data-r="1" aria-label="Cake weight" style="width:84px">${[.5,1,2,3].map(k=>`<option value="${k}" ${k==D.kg?"selected":""}>${k} kg</option>`).join("")}</select></div>
<div class="add"><div class="ic">🎂</div><div class="t"><b>Change cake</b></div><select data-f="ci" data-r="1" aria-label="Choose cake" style="width:130px">${CK.map((c,i)=>`<option value="${i}" ${i==D.ci?"selected":""}>${c[0]}</option>`).join("")}</select></div>
${AD.map((a,i)=>`<div class="add"><input type="checkbox" data-a="ad" data-i="${i}" aria-label="${a[0]}" ${D.ad[i]?"checked":""}><div class="ic">${a[1]}</div><div class="t"><b>${a[0]}</b><small>${R(a[2])}</small></div>${D.ad[i]?`<div class="qty"><button data-a="q" data-i="${i}" data-d="-1" aria-label="Less">−</button>${D.ad[i]}<button data-a="q" data-i="${i}" data-d="1" aria-label="More">+</button></div>`:""}</div>`).join("")}
<div class="tot"><span>Total Amount</span><span>${R(price())}</span></div></div>`}
if(D.st==3){h+=`<div class="card"><h3>Summary</h3><div class="mut">${EV[D.ev][1]} · ${D.date} · ${D.slot}</div><div class="mut">${CK[D.ci][0]} ${D.kg} kg${AD.filter((a,i)=>D.ad[i]).map((a,i)=>" + "+a[0]).join("")}</div>
<div class="mut">📍 ${E(D.house)}, ${E(D.street)}, ${E(D.city)} - ${E(D.pin)}</div><label for="f_cp">Coupon code</label><div style="display:flex;gap:8px"><input type="text" id="f_cp" data-f="cp" value="${E(D.cp)}" placeholder="Try WISH10"><button class="btn sm" data-a="cp">Apply</button></div>${D.ok?'<div class="mut" style="color:var(--gn)">WISH10 applied: 10% off</div>':""}
<div class="tot"><span>Total Amount</span><span>${R(price())}</span></div></div><div class="card"><h3>Pay with</h3>${[["cod","Pay on delivery (cash or UPI)"]].map(p=>`<label class="pay"><input type="radio" name="pay" data-f="pay" data-r="1" value="${p[0]}" ${D.pay==p[0]?"checked":""}>${p[1]}</label>`).join("")}<div class="mut" style="margin-top:8px">You pay the delivery partner when the cake arrives.</div></div>`}
h+=(D.err?`<div class="err" role="alert">${E(D.err)}</div>`:"")+`<div style="display:flex;gap:10px;margin-top:12px">${D.st>1?'<button class="btn ghost" data-a="back">Back</button>':""}<button class="btn" style="flex:1" data-a="next">${D.st==3?"Confirm & place order":D.st==2?"Continue to payment":"Next"}</button></div>`;return h}
function orders(){const m=S.orders.filter(o=>o.mine).reverse();if(!m.length)return `<div class="card" style="text-align:center"><div style="font-size:48px">🎂</div><h3>No orders yet</h3><p class="mut">Book your first celebration in under a minute.</p><button class="btn" data-a="go" data-v="book">Book now</button></div>`;
return `<h2 style="margin-top:6px">Track your orders</h2>`+m.map(o=>{const op=S.open==o.id||(S.open==null&&o==m[0]);return `<div class="card"><button data-a="tg" data-i="${o.id}" style="all:unset;cursor:pointer;display:block;width:100%"><div style="display:flex;justify-content:space-between"><b>#WM${o.id}</b>${chip(o.s)}</div><div class="mut">${EV[o.ev][1]} · ${o.date} · ${E(o.slot)}</div><div>${E(o.cake)} ${o.kg} kg · <b>${R(o.total)}</b></div></button>${op?tl(o)+(o.dname&&o.s>=3?`<div class="dp"><div class="av">${E(o.dname[0])}</div><div><b>${E(o.dname)}</b><div class="mut">Delivery partner</div></div></div>`:"")+(o.s==3?`<p>Give OTP <b>${o.otp}</b> to your delivery partner.</p>`:"")+`<div style="text-align:center;margin-top:8px"><div class="qr" data-t="WISHME|WM${o.id}" style="margin:0 auto"></div><div class="mut">Parcel QR · #WM${o.id}</div></div>`:""}</div>`}).join("")}
function delivery(){const mine=S.orders,act=mine.filter(o=>o.s>=1&&o.s<4);
return `<div class="dh"><h3>🛵 ${E(S.staff.name)}</h3><div class="stats" style="margin-top:10px"><div class="card"><b>${act.length}</b><span>Active</span></div><div class="card"><b>${mine.filter(o=>o.s==4).length}</b><span>Delivered</span></div></div></div>
${act.map(o=>`<div class="card"><div style="display:flex;justify-content:space-between"><b>#WM${o.id}</b>${chip(o.s)}</div><div>${E(o.cust)} · ${E(o.cake)} ${o.kg} kg</div>${o.phone?`<div><a href="tel:${E(o.phone)}">📞 ${E(o.phone)}</a></div>`:""}<div class="mut">${E(o.addr)} · ${E(o.slot)}</div>${o.pay=="cod"?`<div><b>Collect ${R(o.total)}</b></div>`:""}${o.s==3?`<label for="o${o.id}">Customer OTP</label><input type="text" id="o${o.id}" inputmode="numeric" maxlength="4"><button class="btn gn full" data-a="dl" data-i="${o.id}">Mark delivered</button>${S.err?`<div class="err" role="alert">${E(S.err)}</div>`:""}`:'<div class="mut">Waiting to be sent out.</div>'}</div>`).join("")||'<div class="card mut">No active deliveries. New ones appear here when the owner assigns them.</div>'}`}
function admin(){const os=S.orders,rev=os.filter(o=>o.s==4).reduce((a,o)=>a+o.total,0),days=[...Array(7)].map((_,i)=>ago(6-i)),v=days.map(d=>os.filter(o=>o.created==d).reduce((a,o)=>a+o.total,0)),mx=Math.max(...v,1);
return `<h2 style="margin-top:6px">Admin dashboard</h2><div class="stats"><div class="card"><b>${os.length}</b><span>Total orders</span></div><div class="card"><b>${R(rev)}</b><span>Total revenue</span></div><div class="card"><b>${os.filter(o=>o.s<3).length}</b><span>Pending orders</span></div><div class="card"><b>${os.filter(o=>o.s==3).length}</b><span>Out for delivery</span></div></div>
<div class="card" style="margin-top:12px"><h3>Sales, last 7 days</h3><svg viewBox="0 0 280 110" width="100%" role="img" aria-label="Sales bar chart">${v.map((x,i)=>`<rect x="${i*40+8}" y="${90-x/mx*80}" width="26" height="${x/mx*80}" rx="5" fill="#ef3e72"/><text x="${i*40+21}" y="105" font-size="9" text-anchor="middle" fill="currentColor">${days[i].slice(8)}</text>`).join("")}</svg></div>
<div class="card"><h3>🛵 Delivery team</h3><div class="mut">${DP.length?E(DP.join(", ")):"No delivery partners yet. Add one below."}</div><div class="g2"><div><label for="ad_n">Name</label><input type="text" id="ad_n"></div><div><label for="ad_p">Mobile</label><input type="tel" id="ad_p" inputmode="numeric" maxlength="10"></div></div><label for="ad_w">Password (6+ characters)</label><input type="text" id="ad_w"><button class="btn sm" data-a="addd" style="margin-top:10px">Add delivery partner</button>${S.err?`<div class="err" role="alert">${E(S.err)}</div>`:""}</div><div class="card"><h3>Recent orders</h3>${os.slice().reverse().map(o=>`<div class="tb"><div><b>#WM${o.id}</b> ${E(o.cust)}<div class="mut">${R(o.total)} · ${chip(o.s)}</div></div><div style="text-align:right"><button class="btn sm ghost" data-a="lb" data-i="${o.id}" style="display:block;margin:0 0 6px auto">🏷 Label</button>${o.s<3?`${o.s==2?`<select data-a="as" data-i="${o.id}" aria-label="Assign delivery partner" style="padding:6px"><option value="">Assign</option>${DP.map((d,i)=>`<option value="${i}" ${o.dv===i?"selected":""}>${d}</option>`).join("")}</select> `:""}<button class="btn sm" data-a="nx" data-i="${o.id}">${NXT[o.s]}</button>`:o.dv!=null?`<span class="mut">${DP[o.dv]}</span>`:""}</div></div>`).join("")}</div>`}
function render(){const c=!S.staff&&S.tab!="staff";$("seg").innerHTML=S.staff?`<button data-a="slo">Log out · ${E(S.staff.name)}</button>`:S.tab=="staff"?'<button data-a="go" data-v="home">← Back to Wishme</button>':'<button data-a="sl">Staff login</button>';
$("nav").style.display=c?"flex":"none";$("nav").innerHTML=[["home","🏠","Home"],["book","🎉","Book"],["orders","📦","Orders"]].map(t=>`<button data-a="go" data-v="${t[0]}" class="${S.tab==t[0]?"on":""}"><span>${t[1]}</span>${t[2]}</button>`).join("");
$("app").innerHTML=c?(S.tab=="home"?home():S.tab=="book"?book():orders()):S.staff?(S.staff.role=="admin"?admin():delivery()):staffView();$("lab").innerHTML=LB?labView():"";drawQR();save()}
async function place(){if(D.busy)return;D.busy=1;D.err="";render();try{const r=await api("/orders","POST",{name:D.name,phone:D.phone,ev:D.ev,cake:CK[D.ci][0],kg:+D.kg,ad:D.ad,date:D.date,slot:D.slot,msg:D.msg,addr:[D.house,D.street,D.loc,D.land?"Near "+D.land:"",D.city,D.state].filter(Boolean).join(", ")+" - "+D.pin,coupon:D.ok?"WISH10":""});S.mine.push({id:r.id,token:r.token});S.open=r.id;S.tab="orders";D=nd();conf()}catch(e){D.err=e.message;D.busy=0}render();load()}
function next(){D.err="";if(D.st==1){const d=Math.round((new Date(D.date+"T00:00")-new Date(iso(new Date())+"T00:00"))/864e5);
 if(!D.name.trim())D.err="Enter your name.";else if(!/^\d{10}$/.test(D.phone.trim()))D.err="Enter a 10-digit phone number.";else if(isNaN(d)||d<0||d>10)D.err="Pick an event date within the next 10 days.";else if(!/^\d{6}$/.test(D.pin))D.err="Enter a 6-digit pincode.";else if(!D.loc.trim()||!D.house.trim()||!D.street.trim())D.err="Fill locality, house no. and street.";else if(!D.city.trim()||!D.state.trim())D.err="Enter city and state."}
 if(!D.err){if(D.st==1){S.addr={pin:D.pin,city:D.city,state:D.state,loc:D.loc,house:D.house,street:D.street,land:D.land,at:D.at};S.user={name:D.name.trim(),phone:D.phone}}if(D.st==3)place();else D.st++}render()}
document.addEventListener("input",e=>{const t=e.target,f=t.dataset.f;if(f&&!t.dataset.r){D[f]=t.value;if(f=="pin"){t.value=D.pin=t.value.replace(/\D/g,"");if(D.pin.length==6){const r=PC[D.pin.slice(0,3)],st=SM[+D.pin.slice(0,2)];D.city=r?r[0]:D.city;D.state=r?r[1]:(st||D.state);$("f_city").value=D.city;$("f_state").value=D.state;pinFetch(D.pin)}}if(f=="phone")t.value=D.phone=t.value.replace(/\D/g,"")}});
document.addEventListener("change",e=>{const t=e.target,f=t.dataset.f;if(f){D[f]=(f=="ci")?+t.value:t.value;if(f=="cp")return;if(t.dataset.r)render()}if(t.dataset.a=="as"){const o=S.orders.find(x=>x.id==t.dataset.i);o.dv=t.value===""?null:+t.value;if(o.dv!=null)act("/admin/orders/"+o.id+"/assign","PATCH",{delivery_id:DPL[o.dv].id});else load()}if(t.dataset.a=="ad"){D.ad[t.dataset.i]=t.checked?1:0;render()}if(t.id=="dpsel"){S.dp=+t.value;S.err="";render()}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.tagName=="INPUT"||b.tagName=="SELECT")return;const a=b.dataset.a,i=+b.dataset.i;
 if(a=="go"){S.tab=b.dataset.v;S.err=""}else if(a=="sl"){S.tab="staff";S.err=""}else if(a=="slo"){S.staff=null;S.tab="home";S.orders=[];S.err=""}else if(a=="slogin")return slogin();else if(a=="addd")return addDel();else if(a=="ev"){D.ev=i;D.st=1;S.tab="book"}else if(a=="ev2")D.ev=i;else if(a=="ck"){D.ci=i;D.st=1;S.tab="book"}
 else if(a=="q"){D.ad[i]=Math.max(1,D.ad[i]+ +b.dataset.d)}else if(a=="cp"){D.ok=D.cp.trim().toUpperCase()=="WISH10"?1:0;D.err=D.ok?"":"That code is not valid."}
 else if(a=="lb"){LB=i}else if(a=="lc"){LB=null}else if(a=="pr"){try{window.print()}catch(e){}return}else if(a=="login"){login()}else if(a=="out"){S.user=null;D=nd()}else if(a=="at"){D.at=b.dataset.v}else if(a=="back"){D.st--;D.err=""}else if(a=="next")return next();else if(a=="tg")S.open=S.open==i?0:i;
 else if(a=="nx"){const o=S.orders.find(x=>x.id==i);if(o.s==2&&o.dv==null){alert("Assign a delivery partner first.");return}return act("/admin/orders/"+i,"PATCH",{delivery_id:o.dv==null?undefined:DPL[o.dv].id})}
 else if(a=="dl")return act("/delivery/orders/"+i+"/deliver","POST",{otp:document.getElementById("o"+i).value.trim()},1)
 render();if(needsLoad())load()});
render();load();setInterval(()=>{if(needsLoad()&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))load()},15000);
</script></body></html>
